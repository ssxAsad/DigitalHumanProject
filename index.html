<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Project-ARIA</title>
    <link rel="stylesheet" href="style.css" />

    <style>
        #face-video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/",
                "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.min.js",
                "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.4.2/lib/three-vrm-animation.module.min.js",
                "@pixiv/three-vrm-springbone": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-springbone@3.4.2/lib/three-vrm-springbone.module.min.js"
            }
        }
    </script>
</head>
<body>
    <div id="loading-overlay">
        <div id="progress-container">
            <div id="progress-bar"></div>
            <div id="progress-text">Loading... 0%</div>
        </div>
    </div>

    <div id="header-bar">
        <h1 id="header-title" class="fire-text">Chatting with ARIA</h1>
         <button id="face-tracking-button" class="action-button">Face Tracking</button>
    </div>
    <div id="canvas-container"></div>
    <div id="subtitle-container"></div>
    <div id="face-video-container">
        <video id="face-video" autoplay playsinline muted width="640" height="480"></video>
    </div>

    <div id="thinking-bubble" class="bubble"></div>
    <div id="text-bubble" class="bubble"></div>

    <div id="chat-container">
        <div id="expression-container">
            </div>
        <div id="input-container">
            <input type="text" id="chat-input" placeholder="Type your message...">
            <button id="toggle-text-button" class="action-button">
            <img src="mic.svg" alt="Mic" style="width:22px; height:22px;">
            </button>
            <button id="send-button" class="action-button">Send</button>
        </div>
    </div>

    <div id="expression-sliders"></div>

    <script type="module" src="main.js"></script>

    <script defer src="libs/face-api.min.js"></script>

</body>
</html>
